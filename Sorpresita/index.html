<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti</title>
<meta name="description" content="21 de septiembre, flores amarillas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --cielo-alto:#1b1330;
  --cielo-medio:#5b2f5e;
  --cielo-rosa:#a8486a;
  --cielo-naranja:#dd7a4c;
  --horizonte:#f0a95f;
  --petalo:#f3c04a;
  --petalo-hondo:#e09a2d;
  --corazon:#8a4a22;
  --tallo:#3d6b4c;
  --tierra:#170f22;
  --texto:#fbe9dc;
  --tenue:#d7aFA0;
  --display:"Cormorant Garamond",Georgia,serif;
  --ui:"Jost",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{
  margin:0;height:100%;
  font-family:var(--ui);
  color:var(--texto);
  background:var(--cielo-alto);
  overflow:hidden;
  position:relative;
}
.escena{position:relative;height:100%;width:100%;overflow:hidden;isolation:isolate}

/* ---------- cielo ---------- */
.cielo{position:absolute;inset:0;z-index:0;
  background:linear-gradient(180deg,
    #14102a 0%, #2a1740 22%, #5b2f5e 44%, #a8486a 64%, #dd7a4c 80%, #f0a95f 92%, #f7c47a 100%);
}
.cielo::after{ /* calido que sube al abrir */
  content:"";position:absolute;inset:0;opacity:0;transition:opacity 2.6s ease;
  background:linear-gradient(180deg,
    #201741 0%, #4a2557 20%, #97405f 40%, #d96f4f 62%, #f2a25a 80%, #ffd08a 100%);
}
.abierto .cielo::after{opacity:1}
.sol{
  position:absolute;left:50%;bottom:16%;width:min(46vw,290px);aspect-ratio:1;
  transform:translate(-50%,42%);
  border-radius:50%;
  background:radial-gradient(circle,#ffe6a8 0%,#ffc06a 38%,rgba(255,150,80,.30) 62%,rgba(255,150,80,0) 72%);
  filter:blur(1px);
  transition:transform 3.2s cubic-bezier(.2,.7,.2,1), opacity 2.4s ease;
  opacity:.8;z-index:1;
}
.abierto .sol{transform:translate(-50%,24%) scale(1.12);opacity:1}
.estrella{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff3d6;opacity:0;animation:titila 4s ease-in-out infinite;z-index:1}
@keyframes titila{0%,100%{opacity:.12;transform:scale(.7)}50%{opacity:.75;transform:scale(1)}}

/* ---------- luciernagas ---------- */
.luces{position:absolute;inset:0;z-index:3;pointer-events:none}
.luz{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,#fff6c4 0%,rgba(255,214,110,.75) 35%,rgba(255,190,80,0) 70%);
  animation:flota linear infinite, parpadea ease-in-out infinite;
  opacity:0;
}
@keyframes flota{
  0%{transform:translate3d(0,0,0)}
  25%{transform:translate3d(18px,-26px,0)}
  50%{transform:translate3d(-12px,-52px,0)}
  75%{transform:translate3d(22px,-80px,0)}
  100%{transform:translate3d(0,-110px,0)}
}
@keyframes parpadea{0%,100%{opacity:0}18%{opacity:.85}45%{opacity:.25}70%{opacity:.95}}

/* ---------- jardin ---------- */
.jardin{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:min(124vh,126vw,790px);
  z-index:2;
  display:block;
}
.hierba{
  position:absolute;left:50%;bottom:0;
  transform:translateX(-50%);
  width:min(124vh,126vw,790px);
  z-index:3;display:block;pointer-events:none;
}
.hojaLarga{transform-box:fill-box;transform-origin:50% 100%;animation:brisa 9s ease-in-out infinite}
.suelo{
  position:absolute;left:0;right:0;bottom:0;
  width:100%;
  height:calc(min(124vh,126vw,790px) * 0.152);
  z-index:2;display:block;
}
.velo{
  position:absolute;left:0;right:0;top:0;height:58%;
  z-index:4;pointer-events:none;
  background:linear-gradient(180deg,rgba(22,13,36,.62) 0%,rgba(22,13,36,.34) 42%,rgba(22,13,36,0) 100%);
}
.tallo{stroke:var(--tallo);stroke-width:6.5;stroke-linecap:round;fill:none;
  stroke-dasharray:100 102;stroke-dashoffset:101}
.abierto .tallo{animation:crece 1.15s cubic-bezier(.24,.72,.24,1) forwards;animation-delay:var(--d)}
@keyframes crece{to{stroke-dashoffset:0}}
.hoja{fill:#43734f;opacity:0;transform:scale(.15)}
.abierto .hoja{animation:abreHoja .7s cubic-bezier(.2,1.2,.4,1) forwards;animation-delay:var(--d)}
@keyframes abreHoja{to{opacity:1;transform:scale(1)}}
.brote{transform:translateY(var(--sube))}
.abierto .brote{animation:brota 1.15s cubic-bezier(.24,.72,.24,1) forwards;animation-delay:var(--d)}
@keyframes brota{from{transform:translateY(var(--sube))}to{transform:translateY(0)}}
.secundaria{opacity:.68}
.luminosa .lampara{animation:pulsoLuz 4.2s ease-in-out infinite 4.6s}
@keyframes pulsoLuz{0%,100%{opacity:1}50%{opacity:.72}}
.jardin,.suelo,.hierba{pointer-events:none}
.listo .escena{cursor:pointer}
.chispa{opacity:0;transition:opacity .45s ease}
.mata.brilla .chispa{opacity:1}
.mata.brilla .rebote{animation:saluda 1s ease}
@keyframes saluda{0%,100%{transform:translateY(0)}32%{transform:translateY(-7px)}}
.mata:focus{outline:none}
.mata:focus-visible .chispa{opacity:1}
.mata{transform-box:fill-box;transform-origin:50% 100%;animation:brisa 7.4s ease-in-out infinite}
.mata.m2{animation-duration:8.8s;animation-delay:-2.4s}
.mata.m3{animation-duration:6.4s;animation-delay:-4.6s}
.pasto{stroke:#2c4a38;stroke-width:3.5;stroke-linecap:round;fill:none;opacity:.9}
.mecer{transform-box:fill-box;transform-origin:50% 100%;animation:brisa 7s ease-in-out infinite}
.mecer.b{animation-duration:8.6s;animation-delay:-2s}
.mecer.c{animation-duration:6.2s;animation-delay:-4s}
.halo{opacity:0}
.abierto .halo{animation:abreHalo 1.8s ease forwards;animation-delay:var(--d)}
@keyframes abreHalo{to{opacity:.85}}
@keyframes brisa{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.3deg)}}

/* petalos cerrados */
.lam{transform-box:fill-box;transform-origin:50% 100%;transform:scale(.34,.10);opacity:.85}
.abierto .lam{animation:despliega 1.15s cubic-bezier(.18,1.35,.35,1) forwards;animation-delay:var(--d)}
@keyframes despliega{
  0%{transform:scale(.34,.10);opacity:.85}
  60%{transform:scale(1.06,1.04)}
  100%{transform:scale(1,1);opacity:1}
}
.corazon,.semilla{transform-box:fill-box;transform-origin:50% 50%;transform:scale(0);opacity:0}
.abierto .corazon,.abierto .semilla{animation:aparecePunto .55s cubic-bezier(.2,1.5,.4,1) forwards;animation-delay:var(--d)}
@keyframes aparecePunto{to{transform:scale(1);opacity:1}}
.semilla{opacity:0}
.capullo{transform-box:fill-box;transform-origin:50% 100%}
.abierto .capullo{animation:cierraCapullo .45s ease forwards;animation-delay:var(--d)}
@keyframes cierraCapullo{to{opacity:0;transform:scale(.25)}}

/* ---------- contenido ---------- */
.contenido{
  position:relative;z-index:5;
  height:100%;
  display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;
  padding:clamp(28px,7vh,72px) 20px 0;
  text-align:center;
  pointer-events:none;
}
.contenido > *{pointer-events:auto}
.fecha{
  font-family:var(--ui);font-weight:300;font-size:.8rem;letter-spacing:.34em;
  text-transform:lowercase;color:var(--tenue);margin:0 0 10px;opacity:0;
  animation:entra 1.4s .3s ease forwards;
}
.llamado{
  font-family:var(--display);font-style:italic;font-weight:300;
  font-size:clamp(1.65rem,5.6vw,2.6rem);line-height:1.2;
  margin:0 0 26px;max-width:16ch;
  text-shadow:0 2px 18px rgba(30,10,40,.45);
  opacity:0;animation:entra 1.6s .6s ease forwards;
}
.boton{
  font-family:var(--ui);font-weight:400;font-size:.94rem;letter-spacing:.12em;
  color:#3a1c22;background:linear-gradient(180deg,#ffe9b0,#f4c264);
  border:0;border-radius:999px;padding:14px 34px;cursor:pointer;
  box-shadow:0 0 0 0 rgba(255,214,120,.55), 0 10px 26px rgba(60,20,40,.35);
  animation:entra 1.4s 1.1s ease forwards, pulso 3.2s 2.4s ease-in-out infinite;
  opacity:0;
  transition:transform .18s ease;
}
.boton:hover{transform:translateY(-2px)}
.boton:active{transform:translateY(1px) scale(.98)}
.boton:focus-visible{outline:2px solid #fff3d0;outline-offset:4px}
@keyframes pulso{
  0%,100%{box-shadow:0 0 0 0 rgba(255,214,120,.5),0 10px 26px rgba(60,20,40,.35)}
  50%{box-shadow:0 0 0 16px rgba(255,214,120,0),0 10px 26px rgba(60,20,40,.35)}
}
.abierto .fecha,.abierto .llamado,.abierto .boton{opacity:0;transform:translateY(-8px);animation:none;transition:opacity .6s ease,transform .6s ease;pointer-events:none}

.contenido .mensaje{pointer-events:none;transition:opacity .5s ease}
.mensaje{
  position:absolute;top:0;left:0;right:0;
  padding:clamp(34px,8vh,80px) 26px 0;
  opacity:0;visibility:hidden;
}
.abierto .mensaje{visibility:visible;animation:entra 2s 2.5s ease forwards}
.mensaje h1{
  font-family:var(--display);font-weight:300;font-style:italic;
  font-size:clamp(1.75rem,6vw,2.9rem);line-height:1.1;
  margin:0 auto 16px;max-width:17ch;
  text-shadow:0 2px 22px rgba(30,10,40,.5);
}
.mensaje p{
  font-family:var(--display);font-weight:300;
  font-size:clamp(1.05rem,3.6vw,1.3rem);line-height:1.62;
  margin:0 auto;max-width:30ch;color:#fdf0e4;
  text-shadow:0 1px 14px rgba(30,10,40,.55);
}
.firma{
  display:block;margin-top:18px;
  font-family:var(--ui);font-weight:300;font-size:.78rem;letter-spacing:.3em;
  color:#f2d8c6;
}
@keyframes entra{to{opacity:1;transform:none}}

/* burbuja con cada razon */
.razon{
  position:absolute;z-index:6;
  width:min(300px,78vw);
  padding:14px 18px;
  border-radius:14px;
  background:rgba(38,20,48,.72);
  border:1px solid rgba(255,214,140,.28);
  backdrop-filter:blur(6px);
  box-shadow:0 12px 34px rgba(20,8,30,.45);
  font-family:var(--display);font-size:1.06rem;line-height:1.5;
  color:#fff3e2;text-align:center;
  opacity:0;transform:translateY(8px) scale(.96);
  transition:opacity .45s ease, transform .45s cubic-bezier(.2,1.2,.4,1);
  pointer-events:none;
}
.razon.visible{opacity:1;transform:translateY(0) scale(1)}
.pistaToca{
  position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  transform:translateX(-50%);
  z-index:6;
  font-family:var(--ui);font-weight:300;font-size:.74rem;letter-spacing:.26em;
  color:#f3d9c4;text-transform:lowercase;white-space:nowrap;
  opacity:0;transition:opacity 1.2s ease;
  text-shadow:0 1px 10px rgba(20,8,30,.7);
  pointer-events:none;
}
.listo .pistaToca{opacity:.9}
.contador{
  display:inline-block;margin-left:10px;
  font-variant-numeric:tabular-nums;color:#ffd9a0;letter-spacing:.14em;
}
.cierre{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);
  z-index:7;width:min(340px,84vw);text-align:center;
  font-family:var(--display);font-style:italic;font-size:clamp(1.15rem,4.4vw,1.5rem);
  line-height:1.5;color:#fff6ea;
  text-shadow:0 2px 20px rgba(20,8,30,.75);
  opacity:0;pointer-events:none;transition:opacity 1.6s ease, transform 1.6s ease;
}
.cierre.visible{opacity:1;transform:translate(-50%,-50%) scale(1)}

@media (max-height:620px){
  .jardin{width:min(112vh,132vw,760px)}
  .llamado{margin-bottom:18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.2s !important}
  .lam{transform:none;opacity:1}
  .corazon,.semilla{transform:none;opacity:1}
  .capullo{opacity:0}
}
</style>
</head>

<script>
(function(){
  var q = new URLSearchParams(location.search);
  if(q.get('titulo')) document.getElementById('titulo').textContent = q.get('titulo');
  if(q.get('mensaje')) document.getElementById('texto').textContent = q.get('mensaje');
  if(q.get('firma')) document.getElementById('firma').textContent = q.get('firma');
  if(q.get('boton')) document.getElementById('boton').textContent = q.get('boton');
  if(q.get('llamado')) document.getElementById('llamado').textContent = q.get('llamado');

  /* estrellas */
  var cielo = document.querySelector('.escena');
  for(var i=0;i<46;i++){
    var s = document.createElement('div');
    s.className = 'estrella';
    s.style.left = (Math.random()*100).toFixed(2) + 'vw';
    s.style.top = (Math.random()*46).toFixed(2) + 'vh';
    s.style.animationDelay = (-Math.random()*4).toFixed(2) + 's';
    var t = (0.6 + Math.random()*1.8).toFixed(1);
    s.style.width = t + 'px'; s.style.height = t + 'px';
    cielo.insertBefore(s, cielo.children[2]);
  }

  /* luciernagas */
  var luces = document.getElementById('luces');
  function encender(n, zona){
    for(var i=0;i<n;i++){
      var l = document.createElement('div');
      l.className = 'luz';
      var d = 4 + Math.random()*9;
      l.style.width = d + 'px'; l.style.height = d + 'px';
      l.style.left = (Math.random()*100).toFixed(2) + 'vw';
      l.style.top = (zona + Math.random()*(96-zona)).toFixed(2) + 'vh';
      l.style.animationDuration = (11 + Math.random()*12).toFixed(1) + 's, ' + (2.6 + Math.random()*3).toFixed(1) + 's';
      l.style.animationDelay = (-Math.random()*14).toFixed(1) + 's, ' + (-Math.random()*5).toFixed(1) + 's';
      luces.appendChild(l);
    }
  }
  encender(14, 48);

  /* abrir */
  var boton = document.getElementById('boton');
  boton.addEventListener('click', function(){
    if(document.body.classList.contains('abierto')) return;
    document.body.classList.add('abierto');
    boton.setAttribute('aria-hidden','true');
    boton.tabIndex = -1;
    setTimeout(function(){ encender(18, 28); }, 900);
    setTimeout(function(){ encender(12, 10); }, 2200);
    setTimeout(activarRazones, 4900);
  });

  /* ---- las nueve razones ---- */
  var RAZONES = [
    'La forma tan dulce con la que siempre me trata.',
    'Su personalidad cálida, y peculiar en el mejor de los sentidos.',
    'Sus ojitos de amor con los que siempre me mira.',
    'Sus ganas de mejorar por ella, por mí y por lo nuestro.',
    'Me ayuda a crecer y a ser mejor persona.',
    'Su belleza, que llega de aquí pasando por cada una de las estrellas que existen.',
    'Hace que mi corazón se sienta en paz, y también que se agite.',
    'Es la mujer que siempre soñé.',
    'Con ella me proyecto de aquí al infinito. Quiero una vida.'
  ];
  for(var r=1;r<=9;r++){
    var v = q.get('r'+r);
    if(v) RAZONES[r-1] = v;
  }
  var CIERRE = q.get('cierre') || 'Nueve razones, y son solo las que caben en un jardín.';

  var burbuja = document.getElementById('razon');
  var burbujaTexto = document.getElementById('razonTexto');
  var contador = document.getElementById('contador');
  var cierre = document.getElementById('cierre');
  var escenaEl = document.getElementById('escena');
  var bloqueMensaje = document.getElementById('mensaje');
  var vistas = {};
  var temporizador = null;

  function ubicar(mata){
    var cabeza = mata.querySelector('.cabeza');
    var c = cabeza.getBoundingClientRect();
    var e = escenaEl.getBoundingClientRect();
    burbuja.style.visibility = 'hidden';
    burbuja.classList.add('visible');
    var ancho = burbuja.offsetWidth, alto = burbuja.offsetHeight;
    var x = c.left + c.width/2 - e.left - ancho/2;
    x = Math.max(12, Math.min(e.width - ancho - 12, x));
    var y = c.top - e.top - alto - 16;
    if(y < 12) y = c.bottom - e.top + 16;
    burbuja.style.left = x + 'px';
    burbuja.style.top = y + 'px';
    burbuja.style.visibility = 'visible';
  }

  function mostrar(mata){
    var n = mata.getAttribute('data-razon');
    burbujaTexto.textContent = RAZONES[parseInt(n,10)-1];
    ubicar(mata);
    mata.classList.add('brilla');
    bloqueMensaje.style.setProperty('opacity','.14','important');
    if(!vistas[n]){
      vistas[n] = true;
      var total = Object.keys(vistas).length;
      contador.textContent = total + ' / 9';
      if(total === 9){
        setTimeout(function(){
          cierre.textContent = CIERRE;
          cierre.classList.add('visible');
        }, 2600);
      }
    }
    clearTimeout(temporizador);
    temporizador = setTimeout(function(){
      burbuja.classList.remove('visible');
      mata.classList.remove('brilla');
      bloqueMensaje.style.removeProperty('opacity');
    }, 5200);
  }

  /* la flor mas cercana al toque, asi no hay zonas muertas en el celular */
  function masCercana(px, py){
    var matas = document.querySelectorAll('.mata[data-razon]');
    var mejor = null, menor = Infinity;
    Array.prototype.forEach.call(matas, function(m){
      var c = m.querySelector('.cabeza').getBoundingClientRect();
      var dx = (c.left + c.width/2) - px, dy = (c.top + c.height/2) - py;
      var d = Math.sqrt(dx*dx + dy*dy);
      if(d < menor){ menor = d; mejor = m; }
    });
    return menor < 150 ? mejor : null;
  }

  function activarRazones(){
    document.body.classList.add('listo');
    escenaEl.addEventListener('click', function(ev){
      if(!document.body.classList.contains('listo')) return;
      var m = masCercana(ev.clientX, ev.clientY);
      if(m) mostrar(m);
    });
    /* recorrido con teclado */
    var matas = document.querySelectorAll('.mata[data-razon]');
    var orden = Array.prototype.slice.call(matas).sort(function(a,b){
      return a.getAttribute('data-razon') - b.getAttribute('data-razon');
    });
    var foco = -1;
    document.addEventListener('keydown', function(ev){
      if(!document.body.classList.contains('listo')) return;
      if(ev.key === 'ArrowRight' || ev.key === 'ArrowLeft' || ev.key === 'Enter' || ev.key === ' '){
        ev.preventDefault();
        if(ev.key === 'ArrowLeft') foco = (foco - 1 + orden.length) % orden.length;
        else foco = (foco + 1) % orden.length;
        mostrar(orden[foco]);
      }
    });
  }
})();
</script>
</body>
</html>
